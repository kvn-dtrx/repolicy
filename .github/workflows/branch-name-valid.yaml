name: Is Branch Name Valid
on:
  workflow_call:
    inputs:
      branch:
        required: false
        type: string
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  branch-name-valid:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repolicy
        uses: actions/checkout@v4
        with:
          repository: kvn-dtrx/repolicy
          path: .repolicy
      - name: Check Branch Name
        env:
          BRANCH: ${{ inputs.branch || github.head_ref }}
        run: .repolicy/src/adapters/github-actions/run-rule branch-name-valid.bash "${BRANCH}"

name: Are Commit Messages Valid
on:
  workflow_call:
    inputs:
      base_sha:
        required: true
        type: string
      head_sha:
        required: true
        type: string
jobs:
  commit-messages-valid:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout Repolicy
        uses: actions/checkout@v4
        with:
          repository: kvn-dtrx/repolicy
          path: .repolicy
      - name: Check Commit Messages
        env:
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ inputs.head_sha }}
        shell: bash
        run: |
          messages=()
          while IFS= read -r -d '' message; do messages+=("${message}"); done \
            < <(git log --format='%s%x00' "${BASE_SHA}..${HEAD_SHA}")
          .repolicy/src/adapters/github-actions/run-rule \
            commit-message-valid.sh "${messages[@]}"

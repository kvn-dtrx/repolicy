name: Is Commit Message Valid

on:
  workflow_call:
  pull_request:
    types:
      - opened
      - synchronize

jobs:
  is-commit-message-valid:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Run Core Task
        env:
          SCRIPT_URL: "https://raw.githubusercontent.com/kvn-dtrx/git-automatisation/main/src/hooks/commit-msg/commit-message-valid.sh"
        run: |
          curl -fslL "${SCRIPT_URL}" -o tmp-script
          chmod +x tmp-script
          ./tmp-script

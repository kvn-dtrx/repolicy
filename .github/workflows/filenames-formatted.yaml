name: Are Filenames Formatted
on:
  workflow_call:
    inputs:
      paths:
        required: false
        type: string
        default: "."
jobs:
  filenames-formatted:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Checkout Repolicy
        uses: actions/checkout@v4
        with:
          repository: kvn-dtrx/repolicy
          path: .repolicy
      - name: Check Tracked Filenames
        env:
          INPUT_PATHS: ${{ inputs.paths }}
        shell: bash
        run: |
          paths=()
          while IFS= read -r -d '' path; do paths+=("${path}"); done \
            < <(git ls-files -z -- "${INPUT_PATHS}")
          .repolicy/src/adapters/github-actions/run-rule \
            filenames-formatted.bash "${paths[@]}"

name: Are Notebooks Cleared
on:
  workflow_call:
    inputs:
      base_sha:
        required: true
        type: string
      head_sha:
        required: true
        type: string
jobs:
  notebooks-cleared:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout Repolicy
        uses: actions/checkout@v4
        with:
          repository: kvn-dtrx/repolicy
          path: .repolicy
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Check Changed Notebooks
        env:
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ inputs.head_sha }}
        shell: bash
        run: |
          paths=()
          while IFS= read -r -d '' path; do paths+=("${path}"); done \
            < <(git diff --name-only -z --diff-filter=ACM "${BASE_SHA}" "${HEAD_SHA}" -- '*.ipynb')
          .repolicy/src/adapters/github-actions/run-rule \
            notebooks-cleared.bash "${paths[@]}"

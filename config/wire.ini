# ---
# title: Wire mounts for Repolicy
# ---
# bin = public command; libexec = executable internals (log-*, catalog runner).
# Rules, actions, and adapters are installed separately by Make.
# See dia-project-annex Form B / WIRING.md.

# ---

[mount.bin]
from = src/wire/bin
root = "${MY_LOCAL_HOME}/bin"
mode = symlink

[mount.libexec]
from = src/wire/libexec
root = "${MY_LOCAL_HOME}/libexec/repolicy"
mode = symlink
